<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melo | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../src/config.js"></script>
    <script src="../src/email-service.js"></script>
    <script src="../src/JavaScript Modules/gmail-notifications.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-[#0d1117] text-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-[#161b22] p-8 rounded-3xl border border-gray-800 shadow-2xl relative z-10 animate-pageFadeIn">
        <div class="text-center mb-8">
            <div class="inline-block p-4 bg-purple-900/30 rounded-full mb-4">
                <i data-lucide="brain-circuit" class="w-12 h-12 text-purple-400"></i>
            </div>
            <h2 class="text-3xl font-bold text-white mb-2">Welcome to Melo</h2>
            <p class="text-gray-400">Your companion for mental wellness</p>
        </div>

        <div class="space-y-6">
            <a id="continue-btn" href="melo.html" class="flex items-center justify-center gap-2 w-full py-3 px-4 rounded-2xl border border-gray-700 bg-purple-700/90 hover:bg-purple-600 text-white font-medium transition-colors">
                <span>Continue</span>
            </a>
            <p class="text-[11px] text-gray-500 text-center">
                Use guest mode or email sign-in to access Melo.
            </p>
        </div>

        <div class="mt-8 text-center">
            <p class="text-xs text-gray-500">
                By entering, you agree to our privacy focused approach to mental health.
            </p>
        </div>
    </div>

    <!-- Side Notification Pop -->
    <div id="side-notification" class="fixed right-6 bottom-24 max-w-sm bg-purple-900/90 backdrop-blur-md p-4 rounded-2xl border border-purple-500/30 shadow-2xl hidden transform translate-x-full transition-transform duration-500 ease-out z-50">
        <div class="flex items-start space-x-4">
            <div class="p-2 bg-purple-500/20 rounded-lg">
                <i data-lucide="bell" class="w-6 h-6 text-purple-300"></i>
            </div>
            <div>
                <h4 class="font-bold text-white text-sm">Privacy Tip</h4>
                <p class="text-xs text-purple-200 mt-1">Melo uses Gmail only for notifications. Your data stays private and anonymous. 🛡️</p>
            </div>
            <button onclick="closeNotification()" class="text-purple-300 hover:text-white">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>
    </div>

    <script>
        // Fallback CONFIG when config.js fails to load (e.g. Vercel path issues)
        if (typeof CONFIG === 'undefined') {
            window.CONFIG = { STORAGE_KEYS: { LOGGED_IN: 'melo_logged_in', USER_EMAIL: 'melo_user_email', USER_ID: 'melo_user_id' } };
        }

        if (window.lucide && typeof window.lucide.createIcons === 'function') {
            window.lucide.createIcons();
        }

        setTimeout(() => {
            const notif = document.getElementById('side-notification');
            if (!notif) return;
            notif.classList.remove('hidden');
            setTimeout(() => notif.classList.remove('translate-x-full'), 100);
        }, 2000);

        function closeNotification() {
            const notif = document.getElementById('side-notification');
            if (!notif) return;
            notif.classList.add('translate-x-full');
            setTimeout(() => notif.classList.add('hidden'), 500);
        }

        // If already authenticated (cookie session), go straight to the app.
        window.addEventListener('load', async function () {
            try {
                const res = await fetch('/api/me', { credentials: 'include' });
                if (res.ok) window.location.href = 'melo.html';
            } catch (e) {
                // ignore
            }
        });
    </script>
</body>
</html>
